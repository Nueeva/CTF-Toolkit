<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cli-main-menu</title>
  <style>
    body { margin: 0; background: #0d1117; color: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .wrap { padding: 20px; }
    .term { border: 1px solid #30363d; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px #161b22 inset; }
    .bar { background: #161b22; padding: 8px 12px; color: #8b949e; font-size: 13px; border-bottom: 1px solid #30363d; }
    pre { margin: 0; padding: 16px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="term">
      <div class="bar">ctf-toolkit@local:~$ python3 main.py</div>
      <pre>=== CTF Toolkit CLI ===
[1] Crypto
[2] BinEx
[3] Web
[4] Forensics / RE
[5] Utilities
[6] Defensive / Blue Team
[0] Exit
Pilih opsi menu: [+] Keluar dari toolkit. Bye!</pre>
    </div>
  </div>
</body>
</html>
