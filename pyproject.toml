[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-toolkit"
version = "1.0.0"
description = "CTF Toolkit (crypto/binex/web/forensics helpers) optimized for low-resource environments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nueeva" }]
dependencies = [
  "requests>=2.0",
  "pycryptodome>=3.0",
  "dpkt>=1.9.8",
]

[project.scripts]
ctf-toolkit = "ctf_toolkit.main_cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ctf_toolkit*"]
